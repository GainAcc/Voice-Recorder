name: Build APK for Android 7

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-recorder-android7-apk
          path: app/build/outputs/apk/foss/debug/*.apk

      - name: Lint (report only)
        if: always()
        continue-on-error: true
        run: ./gradlew lintFossDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-fossDebug.*
          if-no-files-found: ignore
